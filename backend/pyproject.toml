[project]
name = "oneai-backend"
version = "0.1.0"
description = "One AI — backend (FastAPI, async SQLAlchemy 2.0, PostgreSQL + pgvector)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "pgvector>=0.3.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "cryptography>=44.0",
    "html2text>=2024.2.26",
    "charset-normalizer>=3.4",
    "tldextract>=5.3.1",
    "tnefparse>=1.4.0",
    "pdfplumber>=0.11.9",
    "pypdf>=6.13.2",
    "python-docx>=1.2.0",
    "compressed-rtf>=1.0.7",
    "striprtf>=0.0.32",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.9.1",
]

# Virtual project: uv installs only the dependencies, not this package itself.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

# FastAPI dependency markers are designed to be called in argument defaults;
# treat them as immutable so flake8-bugbear B008 does not fire on the idiom.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"
