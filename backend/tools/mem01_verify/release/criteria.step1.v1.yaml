# MEM-01 Phase 0 — criteria.step1.v1 (DRAFT, Stage A)
#
# Role: the formula sheet of the 17-gate exam, transcribed from the frozen criteria sheets in
#       docs/PM/memory/MEM-01/MEM-01-experiments-and-goals.md (Phase 0, "Критерии (17)") and the
#       per-split floors of docs/PM/memory/MEM-01/MEM-01-gold-standard.md §4. Every number here
#       is either quoted from those documents or marked `founder_draft: true` (an orchestrator
#       proposal the founder confirms at the stage-B freeze).
# Used by: tools.mem01_verify.criteria.load_criteria (validation), every gate evaluator, the
#       release manifest (hashed as criteria_sha256), config_hash.
# Depends on: nothing — data only.
# Key invariants:
#   - Acceptance is GATES ONLY: every criterion is a conjunction member; no weights anywhere.
#   - An error never shrinks a denominator; `minimum` is the smallest denominator on which the
#     criterion may be decided — below it the status is ERROR, never PASS.
#   - provisional_gates order is FROZEN: FID, THR, IDENT, ATTR (the verdict line prints it verbatim).
#   - kind: ratio needs a denominator and minimum >= 1 (zero denominator = ERROR, never a vacuous
#     pass); kind: count is an absolute count invariant with no denominator.
#   - This file is DRAFT until `release_state: frozen`; a frozen copy never changes (superseding
#     release only).

criteria_version: "step1.v1"
release_state: draft
authored: "2026-09-06"
authored_by: "One AI Dev session (orchestrator) from the frozen MEM-01 docs"

founder_defaults:
  - id: split_policy
    decision: "H-split three ways for QS/NF/LANG/RET; FID/THR/IDENT/ATTR are validation-only holdouts (provisional in the loop)"
    founder_default: true
  - id: ret_claim
    decision: "bidirectional: >=150 queries per split, >=50 BG->EN, >=50 EN->BG, >=50 same-language"
    founder_default: true
  - id: legacy_formats
    decision: "pptx/odt/ods get deterministic extractors in v0; .doc/.xls conversion or explicit exclusion decided at stage B by file identity (content hash) and frozen in the scope policy"
    founder_default: true
  - id: mixed_language
    decision: "mixed = each of the two languages >= 20% of language-bearing word tokens with >= 5 tokens each; insufficient evidence = und"
    founder_default: true
  - id: attr_fixtures_first
    decision: "ATTR fixtures-first + a single labeled holdout >= 30 forwards"
    founder_default: true

provisional_gates: [FID, THR, IDENT, ATTR]
directional_gates: []

# Environment variables a run may read. Reading any other variable is an integrity error on
# hidden runs (checkpoint / validation). The NAMES in this list enter config_hash (the /goal text:
# a declared list, not a trace of what was read); values are never hashed.
env_allowlist:
  - POSTGRES_HOST
  - POSTGRES_PORT
  - POSTGRES_DB
  - POSTGRES_USER
  - POSTGRES_PASSWORD
  - APP_DB_USER
  - GLOBAL_DB_USER
  - READER_DB_USER
  - ONEAI_APP_PASSWORD
  - ONEAI_GLOBAL_PASSWORD
  - ONEAI_READER_PASSWORD
  - APP_ENV
  - MEM01_GOLD_ROOT
  - MEM01_HIDDEN_ROOT
  - PYTHONUTF8
  - PYTHONIOENCODING
  # §16.16(b): the names libpq/asyncpg read on every connect.
  - PGGSSLIB
  - PGKRBSRVNAME
  - PGSERVICE
  - PGSSLCERT
  - PGSSLKEY
  - PGSSLMAXPROTOCOLVERSION
  - PGSSLMINPROTOCOLVERSION
  - PGSSLMODE
  - PGSSLNEGOTIATION
  - PGTARGETSESSIONATTRS
  - SSLKEYLOGFILE
  # §16.16(b): the platform names a child process and the interpreter need.
  - PATH
  - SYSTEMROOT
  - SYSTEMDRIVE
  - COMSPEC
  - WINDIR
  - TEMP
  - TMP
  - USERPROFILE
  - HOMEDRIVE
  - HOMEPATH
  - HOME
  - APPDATA
  - LOCALAPPDATA
  - PROGRAMDATA
  - VIRTUAL_ENV
  - UV_CACHE_DIR
  - UV_PROJECT_ENVIRONMENT
  - LANG
  - LC_ALL
  # §16.16(b): every name a PINNED distribution reads at import time during the run (measured on
  # the baseline). These are inputs of the pinned dependency set, so they are DECLARED here
  # rather than exempted from the observer; the sealed baseline `opened_outside_closure == []`
  # is the mechanical guard that this block stays complete for the pinned set.
  - NPY_PROMOTION_STATE
  - NUMPY_MADVISE_HUGEPAGE
  - OPENBLAS_MAIN_FREE
  - OPENPYXL_LXML
  - PATHEXT
  - PILLOW_ALIGNMENT
  - PILLOW_BLOCKS_MAX
  - PILLOW_BLOCK_SIZE
  - PROCESSOR_ARCHITECTURE
  - PROCESSOR_ARCHITEW6432
  - PYDANTIC_DISABLE_PLUGINS
  - SPHINX_BUILD
  - TLDEXTRACT_CACHE
  - TLDEXTRACT_CACHE_TIMEOUT
  - XDG_CACHE_HOME

# Repo files outside the editable scope and outside the runner folder that a run may open.
config_files:
  - { path: backend/.env, hashed: false, role: "secret-bearing settings file (opened by pydantic-settings; not hashed; its effect enters through the env allowlist and corpus_digest)" }
  - { path: backend/alembic.ini, hashed: true, role: "alembic configuration" }
  - { path: backend/pyproject.toml, hashed: true, role: "dependencies (also in code_hash)" }
  - { path: backend/uv.lock, hashed: true, role: "dependency lock (also in code_hash)" }
  - { path: backend/.python-version, hashed: true, role: "interpreter pin (also in code_hash)" }

# Ruling (a) + COV, contract 4.6: dispositions come ONLY from this frozen policy and from
# independently established input properties (the message part's declared MIME class and the
# inline flag), never from the extractor's own status. An extraction status can neither create an
# exclusion nor establish delivery on its own.
scope_policy:
  version: v0
  founder_draft: true
  excluded_by_property:
    content_type_prefixes: ["image/", "audio/", "video/"]
    content_type_exact:
      - application/pkcs7-signature
      - application/pgp-signature
      - application/x-pkcs7-signature
      - text/calendar
      - application/ics
      - font/ttf
      - font/otf
      - application/vnd.ms-fontobject
    inline_image: true
    reason: "noise policy v0: non-document MIME classes by declared content type"
  delivered_requires:
    email: { parse_status: parsed, body_present: true }
    attachment: { extraction_status: extracted, text_present: true, extractor_name_present: true, extractor_version_present: true, partial_marker_absent: true }
  not_ready: "every required input that is neither excluded by property nor delivered, including skipped_nondocument on a MIME class outside excluded_by_property, unsupported_format, scanned_pending_ocr, extracted_partial_scanned, truncated, corrupt, encrypted, empty, pending, skipped_oversize"
  legacy_by_file_identity: []   # stage B: content hashes of .doc/.xls with disposition converted|excluded

# Criterion 1 (v2.3): every surface a Unicode scalar can reach a reader through. Stage A names
# the three stored-text surfaces; stage C/D add lexical derivatives, retrieval-unit fields,
# thread-expansion fields and carrier metadata by name.
qs_surfaces:
  - email_body
  - email_subject
  - attachment_text

# Criterion 14 (RED), contract 10.3: every real production handoff a secret can travel. A surface
# without an implementation prints `incomplete`, never PASS.
red_surfaces:
  - { name: email_body, stage_available: A }
  - { name: attachment_text, stage_available: A }
  - { name: attachment_structured_payload, stage_available: A }
  - { name: extraction_detail, stage_available: A }
  - { name: embedding_header, stage_available: D }
  - { name: logging, stage_available: A }

# Chunk cap (ruling (f)) — the tokenizer pin is a stage-B decision; absent pin = CH ERROR.
chunk_policy:
  cap_tokens_email: 500
  cap_tokens_document: 800
  target_tokens_email: [300, 500]
  target_tokens_document: [500, 800]
  tokenizer_id: null
  tokenizer_revision: null
  tokenizer_artifact_sha256: null
  package_lock_sha256: null

# Leakage groups (contract 7): boilerplate is excluded only by frozen designation; the carrier
# count is a review trigger, never a classification. Near-duplicate clustering beyond exact
# normalized-body identity is deferred to stage B.
leakage_policy:
  version: LEAK_GROUPS_V1
  ubiquity_review_trigger: 25
  designated_boilerplate_hashes: []   # stage B: sha256 content hashes the founder designates
  inline_image_excluded: true
  template_rule: "exact EVID_NORM_V1 normalized-body identity"
  near_duplicate_clustering: deferred_stage_b

# Shared edge policies (referenced by name from criteria).
edge_policy_sets:
  standard: &edge_standard
    - "missing prediction for an expected input = counted against the numerator, never dropped"
    - "duplicate or unexpected id in the evaluated set = ERROR (exit 2)"
    - "abstention where a value is required = counted as a miss"
    - "parse error on an expected input = ERROR unless the fixture expects that exact failure status"
    - "zero denominator on a mandatory ratio criterion = ERROR, never PASS (no vacuous pass exists); count invariants have no denominator; denominator-free diagnostics print N/A"
  fixture_failure: &edge_fixture_failure
    - "a fixture that EXPECTS a malformed input passes only if the component produces exactly the specified refusal status (parse_failed, unsupported_format, unknown_zone); an unhandled exception, crash, timeout or silent partial result is ERROR"

gates:

  QS:
    title: "Quote stripping — zero loss of new content, echo/signature mass <= 5%"
    criteria:
      - id: qs.no_content_loss
        set: QS
        evidence_basis: H-test
        split_source: test
        type: Z
        kind: ratio
        formula: "emails with at least one lost required new-content Unicode scalar (checked by OCCURRENCE: the same source span mapped through offsets, never an identical substring elsewhere) divided by emails with new content in the scored split; PASS iff 0"
        numerator_def: "emails in the scored split with >= 1 labeled new-content scalar absent at its mapped position on every qs_surface"
        denominator_def: "emails with labeled new content in the scored split"
        operator: "=="
        threshold: 0
        minimum: 50
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/80 -> PASS; 1/80 -> FAIL (a single lost scalar is a loss)"
        partner: [qs.echo_incidence, qs.echo_mass, qs.signature_mass, attr.provisional.fixtures]
        stage_available: C
      - id: qs.echo_incidence
        set: QS
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "emails with a quote that retained any labeled redundant-quote scalar on any surface divided by all emails with a quote in the scored split; PASS iff <= 0.05"
        numerator_def: "quote-bearing emails retaining >= 1 labeled redundant scalar"
        denominator_def: "quote-bearing emails in the scored split"
        operator: "<="
        threshold: 0.05
        minimum: 50
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "2/50 = 0.04 -> PASS; 3/50 = 0.06 -> FAIL"
        partner: [qs.no_content_loss]
        stage_available: C
      - id: qs.echo_mass
        set: QS
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "retained labeled redundant-quote Unicode scalars (union over qs_surfaces) divided by all labeled redundant scalars in the scored split; PASS iff <= 0.05"
        numerator_def: "labeled redundant scalars still reaching any surface"
        denominator_def: "all labeled redundant scalars in the scored split"
        operator: "<="
        threshold: 0.05
        minimum: 5000
        minimum_founder_draft: true
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "600/20000 = 0.03 -> PASS; 8000/20000 -> FAIL"
        partner: [qs.no_content_loss]
        stage_available: C
      - id: qs.signature_mass
        set: QS
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "retained labeled signature scalars (union over qs_surfaces) divided by all labeled signature scalars; PASS iff <= 0.05"
        numerator_def: "labeled signature scalars still reaching any surface"
        denominator_def: "all labeled signature scalars in the scored split"
        operator: "<="
        threshold: 0.05
        minimum: 1000
        minimum_founder_draft: true
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "150/6000 = 0.025 -> PASS"
        partner: [qs.no_content_loss]
        stage_available: C

  CH:
    title: "Chunking under a pinned token cap and tokenizer; no missing spans; no unapproved overlap"
    criteria:
      - id: ch.no_missing_spans
        set: CH
        evidence_basis: C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "required source spans absent from every emitted chunk divided by required spans; PASS iff 0"
        numerator_def: "required spans (post-QS new content, subject, every delivered attachment span) not covered by any chunk"
        denominator_def: "required spans over the whole corpus roster"
        operator: "=="
        threshold: 0
        minimum: 1000
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/9,000 -> PASS; 1 missing paragraph -> FAIL even with 400 valid chunks"
        partner: [ch.no_unapproved_overlap, ch.no_packing_violations]
        stage_available: D
      - id: ch.no_invalid_chunks
        set: CH
        evidence_basis: C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "chunks over the cap (in pinned tokenizer tokens over the whole embedding input incl. metadata header) or with missing required metadata divided by emitted chunks; PASS iff 0"
        numerator_def: "emitted chunks over cap or malformed"
        denominator_def: "emitted chunks"
        operator: "=="
        threshold: 0
        minimum: 1000
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/12,000 -> PASS"
        partner: [ch.no_missing_spans]
        stage_available: D
      - id: ch.no_illegal_boundaries
        set: CH
        evidence_basis: F+C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "boundaries that silently overlap, drop a tail, invent a section boundary or repeat a header unlabeled divided by checked boundaries; PASS iff 0"
        numerator_def: "illegal boundaries"
        denominator_def: "checked boundaries (corpus + >= 30 boundary fixtures)"
        operator: "=="
        threshold: 0
        minimum: 30
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/3,000 -> PASS"
        partner: [ch.no_missing_spans]
        stage_available: C
      - id: ch.no_packing_violations
        set: CH
        evidence_basis: C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "adjacent chunks of one true section that were mergeable under the cap, or short inputs split into more than one chunk, divided by packing decisions; PASS iff 0"
        numerator_def: "anti-fragmentation violations"
        denominator_def: "packing decisions"
        operator: "=="
        threshold: 0
        minimum: 1000
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "30 mergeable adjacent pairs -> FAIL"
        partner: [ch.no_missing_spans]
        stage_available: D
      - id: ch.no_unapproved_overlap
        set: CH
        evidence_basis: C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "the same source span present in more than one chunk beyond the frozen overlap budget divided by emitted chunks; PASS iff 0"
        numerator_def: "chunks carrying an unapproved repeat"
        denominator_def: "emitted chunks"
        operator: "=="
        threshold: 0
        minimum: 1000
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/12,000 -> PASS"
        partner: [ch.no_missing_spans]
        stage_available: D

  NF:
    title: "Noise filter — zero real documents suppressed, >= 90% noise stopped"
    criteria:
      - id: nf.zero_document_rejection
        set: NF
        evidence_basis: H-test
        split_source: test
        type: Z
        kind: ratio
        formula: "true documents labeled or suppressed as noise divided by all true documents in the scored split (OCR-required and unsupported formats are DOCUMENTS); PASS iff 0"
        numerator_def: "true documents classified or suppressed as noise"
        denominator_def: "true documents in the scored split, including those without extracted text"
        operator: "=="
        threshold: 0
        minimum: 100
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/100 -> PASS; one JPEG invoice as noise -> FAIL"
        partner: [nf.noise_stopped, cov.required_logical_delivered]
        stage_available: C
      - id: nf.noise_stopped
        set: NF
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "noise items stopped divided by all noise items in the scored split; PASS iff >= 0.90"
        numerator_def: "labeled noise stopped by the filter"
        denominator_def: "labeled noise in the scored split"
        operator: ">="
        threshold: 0.90
        minimum: 100
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "92/100 -> PASS; 89/100 -> FAIL"
        partner: [nf.zero_document_rejection]
        stage_available: C
      - id: nf.dedup_groups_correct
        set: NF
        evidence_basis: C
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "wrong canonical/carrier groups divided by audited groups (dedup within tenant only, exact content identity, no merging of merely similar files); PASS iff 0"
        numerator_def: "audited groups with a wrong canonical or a wrong carrier edge"
        denominator_def: "audited canonical/carrier groups (all corpus groups + >= 20 dedup fixtures)"
        operator: "=="
        threshold: 0
        minimum: 20
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/704 -> PASS"
        partner: [vis.no_forbidden_rows]
        stage_available: C

  LANG:
    title: "Language bg/en/mixed/und >= 98% overall and per class; no invalid states"
    criteria:
      - id: lang.accuracy_overall
        set: LANG
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "correct labels divided by all assessable items in the scored split (assessed on quote/signature-stripped prose per founder default mixed_language); PASS iff >= 0.98"
        numerator_def: "assessable items with the correct class"
        denominator_def: "assessable items in the scored split"
        operator: ">="
        threshold: 0.98
        minimum: 200
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "197/200 -> PASS overall"
        partner: [lang.accuracy_per_class, lang.no_invalid_states]
        stage_available: C
      - id: lang.accuracy_per_class
        set: LANG
        evidence_basis: H-test
        split_source: test
        type: R
        kind: ratio
        formula: "for EACH class bg, en, mixed: correct divided by assessable items of that class; PASS iff every class >= 0.98"
        numerator_def: "correct items of the class"
        denominator_def: "assessable items of the class (per class)"
        operator: ">="
        threshold: 0.98
        minimum: 50
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "48/50 for en = 0.96 -> FAIL although overall passes"
        partner: [lang.accuracy_overall]
        stage_available: C
      - id: lang.no_invalid_states
        set: LANG
        evidence_basis: C
        split_source: corpus
        type: Z
        kind: ratio
        formula: "corpus items with an invalid language state (NULL, a value outside bg/en/mixed/und, or und on an assessable item) divided by all corpus items; PASS iff 0"
        numerator_def: "items with an invalid or unexpected language state"
        denominator_def: "all emails and text-bearing attachments in the corpus"
        operator: "=="
        threshold: 0
        minimum: 1000
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "5,893/5,893 NULL -> FAIL (Stage A baseline)"
        partner: [lang.accuracy_overall]
        stage_available: A

  IDEM:
    title: "Idempotence — replay changes nothing; backfill = exactly one new version"
    criteria:
      - id: idem.replay_no_change
        set: IDEM
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "replay scenarios (same versions, same configuration) that changed durable state divided by replay scenarios; PASS iff 0 (the initial creation is the positive control and must create)"
        numerator_def: "scenarios with an unexpected change to content/grant/carrier/chunk/result rows"
        denominator_def: "replay scenarios"
        operator: "=="
        threshold: 0
        minimum: 10
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "10 created; replay +0; retry +0 -> PASS"
        partner: [idem.exactly_once_committed]
        stage_available: A
      - id: idem.exactly_once_committed
        set: IDEM
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "required (canonical input, component version, configuration) keys with zero or more than one committed logical result divided by required keys; PASS iff 0"
        numerator_def: "keys with missing or duplicated committed results"
        denominator_def: "required keys"
        operator: "=="
        threshold: 0
        minimum: 10
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "concurrent duplicate ingest yields exactly one row -> PASS"
        partner: [idem.replay_no_change]
        stage_available: A
      - id: idem.backfill_one_new_version
        set: IDEM
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "explicit version backfills that produced other than exactly one new published result per affected canonical input divided by backfills; PASS iff 0"
        numerator_def: "backfills with zero or > 1 new versions, or an old result presented as processed by the new version"
        denominator_def: "backfill scenarios"
        operator: "=="
        threshold: 0
        minimum: 10
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "backfill 10 inputs -> 10 new versions -> PASS"
        partner: [idem.replay_no_change]
        stage_available: C

  VIS:
    title: "Visibility on every read plane — positive AND negative controls, 2 orgs, 3 personas, BCC"
    criteria:
      - id: vis.no_forbidden_rows
        set: VIS
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "forbidden rows or fields returned divided by forbidden probes (every route x state cell, queried as the REAL reader role); PASS iff 0"
        numerator_def: "negative probes that returned a forbidden row or field (incl. BCC membership in any shared row, revoked grants, other org, no person on restricted rows)"
        denominator_def: "negative probes"
        operator: "=="
        threshold: 0
        minimum: 12
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/24 -> PASS"
        partner: [vis.no_missing_allowed]
        stage_available: A
      - id: vis.no_missing_allowed
        set: VIS
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "required allowed results missing divided by positive probes; PASS iff 0 (deny-all is FAIL)"
        numerator_def: "positive probes that did not return the allowed row"
        denominator_def: "positive probes"
        operator: "=="
        threshold: 0
        minimum: 12
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/24 -> PASS; a persona who sees nothing anywhere -> FAIL"
        partner: [vis.no_forbidden_rows]
        stage_available: A
      - id: vis.no_wrong_inherited_relations
        set: VIS
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "child rows (recipients, attachments, carrier metadata, thread expansion, vectors) visible without a visible parent or admitting a hidden party divided by checked relations; PASS iff 0"
        numerator_def: "checked relations with a wrong inheritance"
        denominator_def: "checked relations"
        operator: "=="
        threshold: 0
        minimum: 6
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/12 -> PASS"
        partner: [vis.no_missing_allowed]
        stage_available: A
      - id: vis.route_state_coverage
        set: VIS
        evidence_basis: F
        split_source: fixtures
        type: Z
        kind: ratio
        formula: "route x state cells of the frozen matrix that were NOT evaluated with at least one positive and one negative probe divided by all cells of the matrix; PASS iff 0 (a route whose plane does not exist yet - thread expansion until stage C, vector search until stage D - leaves its cells unevaluated, so this criterion is incomplete until every route exists)"
        numerator_def: "matrix cells without an evaluated positive AND negative probe"
        denominator_def: "route x state cells of the frozen VIS matrix (5 routes x 8 states)"
        operator: "=="
        threshold: 0
        minimum: 40
        zero_denominator: error
        edge_policies: *edge_standard
        worked_example: "0/40 -> PASS at stage D; 16/40 unevaluated at stage A -> incomplete"
        partner: [vis.no_forbidden_rows, vis.no_missing_allowed]
        stage_available: D
    route_state_matrix:
      routes: [direct_read, lexical_search, attachment_metadata, thread_expansion, vector_search]
      states: [restricted_with_grant, restricted_without_grant, org_visible, grant_revoked, no_person, bcc_only, pooled_session_reuse, shared_attachment_cross_org]
      stage_available: { direct_read: A, lexical_search: A, attachment_metadata: A, thread_expansion: C, vector_search: D }

  ERASE:
    title: "Per-source deletion closes everything derived; shared items survive via other carriers"
    criteria:
