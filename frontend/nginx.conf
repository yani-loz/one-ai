# Static SPA served by non-root nginx (prod target). History-mode fallback to index.html.
# Port 8080 (not 80) so the unprivileged nginx image can bind without root.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security response headers (`always` so they attach to error + shell responses).
  # connect-src is same-origin only; use a deployment-specific nginx template if the API
  # must live on a separate origin. style/font sources cover the
  # Google Fonts import in index.css. NOTE: an add_header in a nested location REPLACES
  # the server-level set, so the /assets/ block below re-declares these.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Long-cache fingerprinted assets; re-declare the security headers because a nested
  # add_header replaces the server-level set.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  }

  # Control C (httpOnly refresh cookie) — PROD REQUIREMENT: the SPA reaches the auth endpoints
  # with RELATIVE paths so the refresh cookie is same-origin (dev does this via the Vite proxy;
  # see frontend/vite.config.ts). In production this nginx (or the ingress in front of it) MUST
  # proxy /auth and /platform to the backend so those requests do NOT fall through to the SPA
  # index.html below. Wire it per the deploy's backend address, e.g.:
  #   location ~ ^/(auth|platform)/ { proxy_pass http://<backend-upstream>:8000; proxy_set_header Host $host; }
  # and set the backend's REFRESH_COOKIE_SECURE=true (TLS) for the cookie to be sent.
  # (Tracked in docs/FIX_BEFORE_PROD.md — the refresh-cookie + TLS/ingress items.)

  location / {
    try_files $uri $uri/ /index.html;
  }
}
