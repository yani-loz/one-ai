name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  file-size-gate:
    name: File-size ceiling (A2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_file_size.py

  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oneai
          POSTGRES_PASSWORD: oneai
          POSTGRES_DB: oneai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: oneai
      POSTGRES_PASSWORD: oneai
      POSTGRES_DB: oneai
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.29"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      # Migration 0009 creates oneai_app/oneai_global NOLOGIN; this sets their LOGIN+password so the
      # app (which now connects as those least-privilege roles) can reach the DB under pytest.
      - run: uv run python -m scripts.provision_roles
      - run: uv run pytest
      # The grader's own regression pins. They run in-process with no database, and they
      # guard the eval harness — the instrument every accept/reject decision is measured on,
      # which pytest does not otherwise exercise.
      - run: uv run python -m scripts.ask_loop.conformance
      # Per-finding proof that every CLOSED row in the security ledger is still sealed: each
      # pin is EXECUTED, and the build fails naming any finding whose seal no longer holds.
      - run: uv run python -m scripts.ask_loop.seal_check
      # Which mechanism actually stops which attack — the CAUSAL half of the seal. seal_check
      # proves the payload never reached the caller; this proves the mechanism the ledger
      # credits is what stopped it, by disabling that one mechanism and requiring its case to
      # get through. Fails on an escape, an over-rejection, an unproven claim, or an
      # enforcement point in sql_execution that has no column here. Must stay AFTER pytest:
      # both use the same database.
      - run: uv run python -m scripts.ask_loop.defence_matrix

  frontend:
    name: Frontend — lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
