# Static SPA served by non-root nginx (prod target). History-mode fallback to index.html.
# Port 8080 (not 80) so the unprivileged nginx image can bind without root.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets; never cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
